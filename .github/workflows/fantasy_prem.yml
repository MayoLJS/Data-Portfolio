name: Unified Football & FPL Data Pipeline

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests soccerdata html5lib lxml

      - name: ⚙️ Run EPL match extraction
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python 02_Automated_Football_Analytics/scripts/extract_match_data.py

      - name: ⚙️ Run FPL & Understat extraction
        run: |
          python 04_Fantasy_PL/scripts/extract_data.py
          python 04_Fantasy_PL/scripts/get_understat.py

      - name: 💾 Commit and push all data changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage data folders for both projects
          git add 02_Automated_Football_Analytics/data/
          git add 04_Fantasy_PL/data/
          
          # Commit and push only if changes exist
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EPL, FPL, and Understat data" && git push)
