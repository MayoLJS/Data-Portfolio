name: Automated FPL Data Extraction

on:
  schedule:
    # This cron schedule runs the script every day at 06:00 UTC. 
    - cron: '0 6 * * *'
  # The workflow_dispatch command adds a "Run Workflow" button so you can trigger it manually anytime.
  workflow_dispatch: 

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    
    # This permission is required so the robot can push the new CSVs back to your repo
    permissions:
      contents: write 

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests soccerdata html5lib lxml

      - name: ⚙️ Run FPL extraction scripts
        run: |
          python 04_Fantasy_PL/scripts/extract_data.py
          python 04_Fantasy_PL/scripts/get_understat.py

      - name: 💾 Commit and push new data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all data changes across the repository
          git add 04_Fantasy_PL/data/
          
          # Check if there are changes to commit, then commit and push
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated FPL and Understat data update" && git push)
