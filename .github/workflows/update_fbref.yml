name: Update FBref Shooting Data

on:
  schedule:
    - cron: '0 4 * * 1' # Runs every Monday at 04:00 UTC
  workflow_dispatch: # Allows manual run button in GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./04_Fantasy_PL

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install soccerdata pandas undetected-chromedriver html5lib lxml

      - name: Run extraction script
        run: python scripts/extract_fbref.py

      - name: Commit and push generated CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/fbref_shooting.csv
          git diff-index --quiet HEAD || (git commit -m "Automated update of FBref shooting data" && git push)
