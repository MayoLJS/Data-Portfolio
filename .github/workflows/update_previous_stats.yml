name: Extract Previous Premier League Stats

on:
  workflow_dispatch:

jobs:
  download-previous-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./04_Fantasy_PL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Python script
        run: python scripts/extract_previous.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/fpl_players_previous.csv
          git commit -m "Manual extraction of previous Premier League stats" || exit 0
          git push
