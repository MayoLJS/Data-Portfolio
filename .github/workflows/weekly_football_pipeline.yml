name: Weekly Football ETL Pipeline

on:
  schedule:
    # Runs at 08:00 UTC every Monday
    - cron: '0 8 * * 0,1,2,3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-extraction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run ETL Script
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python 02_Automated_Football_Analytics/scripts/extract_match_data.py

      - name: Commit and push new data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add 02_Automated_Football_Analytics/data/*.csv
          git commit -m "Auto-update weekly match data" || echo "No changes to commit"
          git push
